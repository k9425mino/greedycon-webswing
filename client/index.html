<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>손목 웹슈터 - 호스트</title>
    <link rel="stylesheet" href="./host/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game-area">
        <canvas id="scene"></canvas>
        <div
          id="crosshair"
          class="crosshair"
          data-pressed="false"
          data-has-target="false"
          data-onscreen="true"
        ></div>
        <div id="target-marker" class="target-marker" hidden></div>
        <div id="hud">
          <div id="hud-score">0</div>
          <div id="hud-speed">0 m/s</div>
          <div id="hud-stall" hidden>전진하세요 <span id="hud-stall-left">0.0</span>초</div>
          <div id="hud-web-status" hidden></div>
        </div>
      </div>

      <aside id="panel">
        <section id="pairing-section">
          <h1>손목 웹슈터</h1>
          <img id="qr-image" alt="컨트롤러 접속 QR" />
          <p><a id="invite-link" target="_blank" rel="noopener"></a></p>
        </section>

        <section id="guide-section">
          <p id="guide-message">폰으로 QR을 스캔해 접속하세요.</p>
        </section>

        <section id="controls-section">
          <h2>조작</h2>
          <button id="btn-calibrate">정면 보정</button>
          <button id="btn-start">게임 시작</button>
          <button id="btn-stop">정지</button>
          <button id="btn-mute">소리 끄기</button>
          <button id="btn-switch-phone">폰 교체</button>
        </section>

        <section id="recovery-section" hidden>
          <p id="recovery-message"></p>
        </section>

        <section id="gameover-section" hidden>
          <p id="gameover-reason"></p>
          <p>점수 <span id="gameover-score">0</span></p>
          <button id="btn-restart">다시 하기</button>
        </section>

        <details id="diagnostics-section">
          <summary>진단 정보</summary>
          <ul>
            <li>연결: <span id="status-connection">대기중</span></li>
            <li>센서: <span id="status-sensor">-</span></li>
            <li>터치: <span id="status-touch">-</span></li>
            <li>단계: <span id="status-phase">pairing</span></li>
            <li>물리: <span id="status-physics">초기화 중</span></li>
            <li>조준각(보정 후): <span id="diag-aim">-</span></li>
            <li>표적: <span id="diag-target">-</span></li>
            <li>거미줄 단계: <span id="diag-web-phase">-</span></li>
            <li>마지막 실패: <span id="diag-web-failure">-</span></li>
            <li>물리 부착: <span id="diag-attach">-</span></li>
            <li>센서 발생률: <span id="diag-sensor-hz">-</span> Hz</li>
            <li>송신률: <span id="diag-send-hz">-</span> Hz</li>
            <li>수신률: <span id="diag-recv-hz">-</span> Hz</li>
          </ul>
        </details>
      </aside>
    </div>
    <script type="module" src="./host/main.ts"></script>
  </body>
</html>
